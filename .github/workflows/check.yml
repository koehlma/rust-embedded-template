name: Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches breaking releases of the dependencies.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-generate@0.26.0
      - run: rustup target add thumbv6m-none-eabi thumbv8m.main-none-eabihf
      - run: scripts/check-variants.sh
